[binaries]
c = ['loongarch32s-unknown-linux-gnusf-gcc', '-nostdlib']
cpp = ['loongarch32s-unknown-linux-gnusf-g++', '-nostdlib']
ar = 'loongarch32s-unknown-linux-gnusf-ar'
as = 'loongarch32s-unknown-linux-gnusf-as'
strip = 'loongarch32s-unknown-linux-gnusf-strip'
nm = 'loongarch32s-unknown-linux-gnusf-nm'

[host_machine]
system = 'unknown'
cpu_family = 'loongarch32'
cpu = 'la32v1.0'
endian = 'little'

[properties]
skip_sanity_check = true
default_flash_addr = '0x1c000000'
default_flash_size = '0x00020000'
default_ram_addr = '0x15000000'
default_ram_size = '0x00010000'
